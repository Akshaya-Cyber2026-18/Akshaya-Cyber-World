
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Runner | ACW</title>
  <link rel="stylesheet" href="runner.css">
</head>
<body>

  <header class="game-header">
    <a href="index.html" class="back-button">← BACK TO ACW</a>
    <h1>CYBER <span>RUNNER</span></h1>
    <p>Run fast. Jump high. Beat your high score!</p>
  </header>

  <main class="game-container">

    <div class="score-board">
      <div>
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>
      <div>
        <small>BEST SCORE</small>
        <strong id="bestScore">0</strong>
      </div>
    </div>

    <div class="game-area" id="gameArea">

      <div class="game-message" id="gameMessage">
        <h2>READY TO RUN?</h2>
        <p>Press START to begin your adventure!</p>
        <button id="startButton">START GAME</button>
      </div>

      <!-- Human runner character -->
      <div class="runner-character" id="player">
        <svg viewBox="0 0 100 120" aria-label="Running character">
          <!-- Head -->
          <circle cx="58" cy="20" r="14" fill="#f3bd91"/>
          <!-- Hair -->
          <path d="M44 17 Q43 0 61 4 Q76 5 74 19 L68 13
                   L61 16 L54 10 L49 20 Z" fill="#252039"/>
          <!-- Eye -->
          <circle cx="65" cy="20" r="2" fill="#101827"/>
          <!-- Body -->
          <path d="M47 36 Q62 30 70 43 L63 70
                   L39 67 L34 46 Z" fill="#087cf0"
                stroke="#42edff" stroke-width="2"/>
          <!-- Arm behind -->
          <path d="M42 42 L24 56 L14 49"
                fill="none" stroke="#087cf0"
                stroke-width="9" stroke-linecap="round"/>
          <!-- Arm forward -->
          <path d="M65 43 L79 34 L87 39"
                fill="none" stroke="#087cf0"
                stroke-width="9" stroke-linecap="round"/>
          <!-- Back leg -->
          <path d="M43 68 L29 87 L12 83"
                fill="none" stroke="#18233e"
                stroke-width="11" stroke-linecap="round"/>
          <path d="M12 83 L5 88 L22 91"
                fill="none" stroke="#42edff"
                stroke-width="7" stroke-linecap="round"/>
          <!-- Front leg -->
          <path d="M58 68 L70 86 L86 82"
                fill="none" stroke="#18233e"
                stroke-width="11" stroke-linecap="round"/>
          <path d="M86 82 L96 87 L78 91"
                fill="none" stroke="#42edff"
                stroke-width="7" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="obstacle" id="obstacle">🚧</div>

      <div class="ground"></div>

    </div>

    <div class="game-controls">
      <button id="jumpButton">⬆ JUMP</button>
      <button id="restartButton">↻ RESTART</button>
    </div>

    <p class="instructions">
      Computer: Press SPACE or UP arrow to jump.<br>
      Mobile: Tap the JUMP button.
    </p>

  </main>

  <script src="runner.js"></script>
</body>
</html>
